<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #09090b; 
            color: #f4f4f5; 
            font-family: 'Outfit', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #18181b 0%, #09090b 70%);
            background-attachment: fixed;
        }
        
        .gold-bg { background: linear-gradient(135deg, #fde047 0%, #fbbf24 50%, #d97706 100%); }
        .gold-text { 
            background: linear-gradient(135deg, #fde047, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .glass-panel {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(251, 191, 36, 0.1);
        }

        .card-dark { 
            background: linear-gradient(180deg, #18181b 0%, #121214 100%);
            border: 1px solid #27272a; 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
        
        .progress-track { background: #27272a; border-radius: 999px; overflow: hidden; height: 10px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #d97706, #fde047); transition: width 0.8s ease; }

        .box-base {
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
            border-radius: 0.75rem; font-size: 0.75rem; font-weight: 800; tracking-wider;
            cursor: pointer; position: relative; overflow: hidden;
            background-color: #27272a; border: 1px solid #3f3f46; color: #a1a1aa;
        }
        .box-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #fde047, #fbbf24, #d97706); z-index: 1; transition: height 0.5s ease; }
        .box-text { position: relative; z-index: 2; }
        .box-saved { box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4); border: none; }

        .hidden { display: none !important; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="glass-panel p-5 sticky top-0 z-40 flex justify-between items-center px-4 md:px-8 border-b-0 rounded-b-2xl">
        <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd" />
            </svg>
            <h1 class="text-2xl font-black uppercase tracking-widest text-white">Vault<span class="gold-text">Tracker</span></h1>
        </div>
        <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs font-bold text-zinc-400 hover:text-white uppercase tracking-wider transition-colors">Log Out</button>
    </header>

    <main id="auth-screen" class="max-w-md mx-auto p-6 mt-12 animate-fade-up">
        <div class="card-dark p-8 rounded-3xl text-center">
            <h2 class="text-3xl font-black text-white mb-2">Welcome Back</h2>
            <p class="text-zinc-400 mb-8 text-sm">Sign in to sync your saving goals across all your devices.</p>
            
            <div class="space-y-4 mb-8 text-left">
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1 block">Email Address</label>
                    <input type="email" id="auth-email" placeholder="you@example.com" class="w-full bg-zinc-900 border border-zinc-700 p-4 rounded-xl focus:border-yellow-500 outline-none text-white">
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1 block">Password</label>
                    <input type="password" id="auth-pass" placeholder="••••••••" class="w-full bg-zinc-900 border border-zinc-700 p-4 rounded-xl focus:border-yellow-500 outline-none text-white">
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full gold-bg text-yellow-950 py-4 rounded-xl font-black hover:scale-105 transition-transform mb-4 shadow-[0_0_20px_rgba(251,191,36,0.2)]">SIGN IN</button>
            <p class="text-sm text-zinc-500">Don't have an account? <button class="text-yellow-500 font-bold hover:underline">Sign up</button></p>
        </div>
    </main>

    <main id="app-dashboard" class="hidden max-w-4xl mx-auto p-4 md:p-6 mt-6">
        <div class="flex justify-center mb-10">
            <button onclick="toggleForm()" class="gold-bg px-8 py-4 rounded-full font-bold text-yellow-950 shadow-[0_0_20px_rgba(251,191,36,0.3)] hover:scale-105 transition-transform flex items-center gap-2">
                CREATE NEW GOAL
            </button>
        </div>

        <div id="setup-form" class="hidden card-dark p-6 md:p-8 rounded-3xl mb-12 border border-zinc-800 animate-fade-up">
            <h2 class="text-2xl font-black mb-6 gold-text uppercase tracking-wide">Target Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" id="goal-item" placeholder="What are you buying?" oninput="calculateTimePreview()" class="bg-zinc-900/50 border border-zinc-700 p-4 rounded-xl focus:border-yellow-500 text-white outline-none">
                <input type="number" id="goal-price" placeholder="Total Price (PKR)" oninput="calculateTimePreview()" class="bg-zinc-900/50 border border-zinc-700 p-4 rounded-xl focus:border-yellow-500 text-white outline-none">
                <select id="save-freq" onchange="calculateTimePreview()" class="bg-zinc-900/50 border border-zinc-700 p-4 rounded-xl text-white outline-none cursor-pointer">
                    <option value="Weekly">Weekly</option>
                    <option value="Monthly">Monthly</option>
                </select>
                <input type="number" id="save-amount" placeholder="Target Deposit per term" oninput="calculateTimePreview()" class="bg-zinc-900/50 border border-zinc-700 p-4 rounded-xl focus:border-yellow-500 text-white outline-none">
            </div>
            
            <p id="time-preview" class="text-center font-bold gold-text mt-6 min-h-[1.5rem] tracking-wider uppercase text-sm"></p>

            <div class="mt-6 flex gap-4">
                <button onclick="createNewGoal()" class="flex-1 gold-bg text-yellow-950 py-4 rounded-xl font-bold">INITIALIZE PLAN</button>
                <button onclick="toggleForm()" class="flex-1 bg-zinc-800 text-zinc-300 py-4 rounded-xl font-bold">CANCEL</button>
            </div>
        </div>

        <div id="goals-list" class="space-y-10"></div>
    </main>

    <div id="custom-confirm" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm px-4">
        <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full">
            <h3 class="text-2xl font-black mb-2 text-white uppercase tracking-widest">Make Deposit</h3>
            <p class="text-zinc-400 mb-6 font-medium text-sm">How much are you adding today?</p>
            <div class="relative mb-8">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 font-bold text-zinc-400">PKR</span>
                <input type="number" id="deposit-input" class="w-full bg-zinc-900 border-2 border-zinc-700 p-4 pl-14 rounded-xl text-white text-xl font-black text-right outline-none">
            </div>
            <div class="flex gap-4">
                <button onclick="processDeposit()" class="flex-1 gold-bg text-yellow-950 py-4 rounded-xl font-black hover:scale-105 transition-transform">DEPOSIT</button>
                <button onclick="closeDepositModal()" class="flex-1 bg-zinc-800 text-zinc-300 py-4 rounded-xl font-bold hover:bg-zinc-700 transition-colors">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        // --- AUTHENTICATION LOGIC ---
        let currentUser = localStorage.getItem('vt_active_user');

        window.onload = () => {
            if (currentUser) showDashboard();
            else showAuthScreen();
        };

        function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(email && pass.length > 3) {
                localStorage.setItem('vt_active_user', email);
                currentUser = email;
                showDashboard();
            } else {
                alert("Please enter a valid email and password.");
            }
        }

        function handleLogout() {
            localStorage.removeItem('vt_active_user');
            currentUser = null;
            showAuthScreen();
        }

        function showDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-dashboard').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            renderGoals();
        }

        function showAuthScreen() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-dashboard').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('auth-pass').value = ''; 
        }

        // --- SAVINGS TRACKER LOGIC ---
        let allGoals = JSON.parse(localStorage.getItem('fluidSavingsData')) || [];
        let activeGoalIdForDeposit = null;

        function toggleForm() { 
            document.getElementById('setup-form').classList.toggle('hidden'); 
            document.getElementById('time-preview').innerText = ''; // clear text on toggle
        }

        // Feature 1: Dynamic Time Preview
        function calculateTimePreview() {
            const item = document.getElementById('goal-item').value;
            const price = parseFloat(document.getElementById('goal-price').value);
            const freq = document.getElementById('save-freq').value;
            const amount = parseFloat(document.getElementById('save-amount').value);
            const previewLabel = document.getElementById('time-preview');

            if (item && price > 0 && amount > 0) {
                const totalTerms = Math.ceil(price / amount);
                const timeUnit = freq === 'Weekly' ? (totalTerms === 1 ? 'week' : 'weeks') : (totalTerms === 1 ? 'month' : 'months');
                previewLabel.innerText = `It will take ${totalTerms} ${timeUnit} to buy your ${item}`;
            } else {
                previewLabel.innerText = '';
            }
        }

        function createNewGoal() {
            const item = document.getElementById('goal-item').value;
            const price = parseFloat(document.getElementById('goal-price').value);
            const amount = parseFloat(document.getElementById('save-amount').value);

            if(!item || !price || !amount) return;

            allGoals.unshift({ id: Date.now(), item, price, targetAmount: amount, totalSaved: 0 });
            saveAndRefresh();
            toggleForm();
            ['goal-item', 'goal-price', 'save-amount'].forEach(id => document.getElementById(id).value = '');
        }

        function renderGoals() {
            const container = document.getElementById('goals-list');
            container.innerHTML = '';
            if (allGoals.length === 0) return;

            allGoals.forEach((goal) => {
                const totalBoxes = Math.ceil(goal.price / goal.targetAmount);
                const progressPercent = Math.min((goal.totalSaved / goal.price) * 100, 100);
                const remaining = Math.max(goal.price - goal.totalSaved, 0);
                const isComplete = remaining <= 0;

                const card = document.createElement('div');
                card.className = `card-dark rounded-[2rem] p-6 md:p-8 animate-fade-up ${isComplete ? 'border-yellow-500/50' : ''}`;
                
                if (isComplete) {
                    card.innerHTML = `<div class="text-center py-8"><h2 class="text-4xl font-black text-white uppercase mb-2">Saved!</h2><p class="text-zinc-400 mb-8">You funded your <span class="text-white font-bold">${goal.item}</span>.</p><button onclick="deleteGoal(${goal.id})" class="text-red-400 text-xs font-bold uppercase tracking-widest">Delete Goal</button></div>`;
                } else {
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="text-3xl font-black uppercase text-white tracking-tight mb-2">${goal.item}</h3>
                                <p class="text-zinc-400 font-medium"><span class="gold-text text-xl font-bold">${remaining.toLocaleString()} PKR</span> Remaining</p>
                            </div>
                            <button onclick="deleteGoal(${goal.id})" class="text-zinc-600 hover:text-red-500">✕</button>
                        </div>
                        <div class="flex items-center gap-4 mb-8">
                            <div class="flex-1 bg-zinc-900/50 p-4 rounded-2xl">
                                <div class="flex justify-between text-sm font-bold uppercase tracking-widest mb-3"><span class="text-white">${progressPercent.toFixed(1)}%</span><span class="gold-text">${goal.totalSaved.toLocaleString()} / ${goal.price.toLocaleString()}</span></div>
                                <div class="progress-track"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                            </div>
                            <button onclick="openDepositModal(${goal.id})" class="h-full px-6 py-4 gold-bg rounded-2xl font-black hover:scale-105 transition-transform text-yellow-950">ADD</button>
                        </div>
                        <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3" onclick="openDepositModal(${goal.id})">
                            ${Array.from({length: totalBoxes}).map((_, i) => {
                                const start = i * goal.targetAmount;
                                const end = (i + 1) * goal.targetAmount;
                                
                                let fill = 0;
                                let savedInThisBox = 0;

                                if (goal.totalSaved >= end) {
                                    fill = 100;
                                    savedInThisBox = goal.targetAmount;
                                } else if (goal.totalSaved > start) {
                                    fill = ((goal.totalSaved - start) / goal.targetAmount) * 100;
                                    savedInThisBox = goal.totalSaved - start;
                                }

                                const done = fill === 100;
                                // Feature 2: Show the money amount instead of just the box number
                                const displayValue = savedInThisBox > 0 ? savedInThisBox.toLocaleString() : (i + 1);

                                return `<div class="h-12 w-full box-base ${done ? 'box-saved text-yellow-950' : ''}">
                                    ${!done && fill > 0 ? `<div class="box-fill" style="height: ${fill}%;"></div>` : ''}
                                    <span class="box-text ${done ? '' : (fill > 50 ? 'text-yellow-900' : '')}">${displayValue}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        function openDepositModal(id) {
            const goal = allGoals.find(g => g.id === id);
            activeGoalIdForDeposit = id;
            document.getElementById('deposit-input').value = Math.min(goal.targetAmount, goal.price - goal.totalSaved);
            document.getElementById('custom-confirm').classList.remove('hidden');
        }

        function closeDepositModal() { document.getElementById('custom-confirm').classList.add('hidden'); activeGoalIdForDeposit = null; }

        function processDeposit() {
            const amt = parseFloat(document.getElementById('deposit-input').value);
            if(isNaN(amt) || amt <= 0) return alert("Invalid amount.");
            const idx = allGoals.findIndex(g => g.id === activeGoalIdForDeposit);
            if(idx > -1) {
                allGoals[idx].totalSaved = Math.min(allGoals[idx].totalSaved + amt, allGoals[idx].price);
                saveAndRefresh();
                closeDepositModal();
            }
        }

        function deleteGoal(id) { if(confirm("Permanently delete this plan?")) { allGoals = allGoals.filter(g => g.id !== id); saveAndRefresh(); } }
        function saveAndRefresh() { localStorage.setItem('fluidSavingsData', JSON.stringify(allGoals)); renderGoals(); }
    </script>
</body>
</html>
